<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARGUS — Case Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
        --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;

        --ink: #121210;
        --surface: #1a1914;
        --surface-raised: #211f18;
        --line: rgba(236, 231, 218, 0.12);
        --line-strong: rgba(236, 231, 218, 0.24);
        --paper: #ece7da;
        --muted: #9c9484;
        --faint: #6b6456;

        --brass: #c9a227;
        --brass-dim: rgba(201, 162, 39, 0.14);
        --clay: #b4532a;
        --clay-dim: rgba(180, 83, 42, 0.14);
        --teal: #5e9485;
        --teal-dim: rgba(94, 148, 133, 0.14);
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--ink);
        background-image:
          repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
        color: var(--paper);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      ::-webkit-scrollbar { width: 7px; height: 7px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(236, 231, 218, 0.14); border-radius: 0; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(236, 231, 218, 0.26); }

      /* ---- Surfaces ---- */
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
      }
      .card {
        background: var(--surface-raised);
        border: 1px solid var(--line);
        transition: border-color 0.18s ease;
      }
      .card:hover {
        border-color: var(--line-strong);
      }

      /* ---- Buttons ---- */
      .btn {
        background: transparent;
        border: 1px solid var(--line-strong);
        color: var(--paper);
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        border-radius: 2px;
        padding: 7px 14px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn:hover { background: rgba(236, 231, 218, 0.06); border-color: var(--paper); }
      .btn:disabled { opacity: 0.45; cursor: default; }
      .btn:disabled:hover { background: transparent; border-color: var(--line-strong); }

      .btn-brass { border-color: var(--brass); color: var(--brass); }
      .btn-brass:hover { background: var(--brass-dim); border-color: var(--brass); }

      .btn-primary {
        background: var(--brass);
        border-color: var(--brass);
        color: #171510;
        font-weight: 600;
      }
      .btn-primary:hover { background: #ddb43a; border-color: #ddb43a; }

      .btn-clay { border-color: var(--clay); color: var(--clay); }
      .btn-clay:hover { background: var(--clay-dim); }

      .btn-teal { border-color: var(--teal); color: var(--teal); }
      .btn-teal:hover { background: var(--teal-dim); }

      .btn-plain {
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 4px;
      }
      .btn-plain:hover { background: rgba(236,231,218,0.06); color: var(--paper); }

      /* ---- Inputs ---- */
      .field-input, select.field-input {
        background: rgba(0,0,0,0.22);
        border: 1px solid var(--line-strong);
        color: var(--paper);
        font-family: var(--font-sans);
        font-size: 13px;
        border-radius: 2px;
        padding: 9px 12px;
        outline: none;
        width: 100%;
      }
      .field-input:focus { border-color: var(--brass); }
      .field-input::placeholder { color: var(--faint); }
      .field-mono { font-family: var(--font-mono); }

      /* ---- Folder-tab navigation ---- */
      .tab-strip {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        padding: 10px 32px 0 32px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        background: transparent;
      }
      .tab {
        background: rgba(0,0,0,0.18);
        border: 1px solid var(--line);
        border-bottom: none;
        color: var(--muted);
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        padding: 9px 16px 8px 16px;
        cursor: pointer;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 7px;
        position: relative;
        top: 1px;
        transition: color 0.15s ease, background 0.15s ease;
      }
      .tab:hover { color: var(--paper); }
      .tab.active {
        background: var(--surface);
        border-color: var(--line-strong);
        color: var(--paper);
        font-weight: 600;
      }
      .tab-count {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--faint);
        background: rgba(236,231,218,0.06);
        padding: 1px 5px;
      }
      .tab.active .tab-count { color: var(--brass); }

      /* ---- Ink stamps (verification / status) ---- */
      .stamp {
        display: inline-block;
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        padding: 2px 8px;
        border: 1.5px solid currentColor;
        border-radius: 2px;
        transform: rotate(-1.4deg);
        white-space: nowrap;
      }
      .stamp-brass { color: var(--brass); }
      .stamp-teal { color: var(--teal); }
      .stamp-clay { color: var(--clay); }
      .stamp-muted { color: var(--faint); border-style: dashed; }

      /* ---- Ledger strip (replaces identical metric cards) ---- */
      .ledger-strip {
        display: flex;
        flex-wrap: wrap;
      }
      .ledger-cell {
        flex: 1 1 200px;
        padding: 18px 24px;
        border-right: 1px solid var(--line);
        border-top: 1px solid var(--line);
      }
      .ledger-cell:first-child { border-left: 1px solid var(--line); }

      .eyebrow {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--faint);
        letter-spacing: 0.03em;
      }

      .fade-in {
        animation: fadeIn 0.28s ease;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
